[mypy]
# Global mypy configuration  
python_version = 3.9
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False

# Ignore third-party libraries without stubs
[mypy-panda3d.*]
ignore_missing_imports = True

[mypy-direct.*]
ignore_missing_imports = True

[mypy-pygltflib.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

# Ignore internal modules that have import path issues
[mypy-helpmesign.utils.natural_pose_service]
ignore_missing_imports = True