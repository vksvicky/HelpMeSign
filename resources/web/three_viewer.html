<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js GLB Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // Robust dynamic loader with multi-CDN fallback
      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload = () => resolve(url);
          s.onerror = () => reject(new Error('Failed to load ' + url));
          document.head.appendChild(s);
        });
      }

      async function ensureThree() {
        const threeUrls = [
          'https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js',
          'https://unpkg.com/three@0.157.0/build/three.min.js'
        ];
        for (const u of threeUrls) {
          try { await loadScript(u); return; } catch (e) { console.error(e); }
        }
        throw new Error('Could not load three.min.js');
      }

      async function ensureExtras() {
        const pairs = [
          [
            'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js',
            'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/loaders/GLTFLoader.js'
          ],
          [
            'https://unpkg.com/three@0.157.0/examples/js/controls/OrbitControls.js',
            'https://unpkg.com/three@0.157.0/examples/js/loaders/GLTFLoader.js'
          ]
        ];
        for (const [a,b] of pairs) {
          try {
            await loadScript(a);
            await loadScript(b);
            return;
          } catch (e) { console.error(e); }
        }
        throw new Error('Could not load three extras');
      }

      async function boot() {
        console.log('Three viewer boot');
        window.addEventListener('error', (e) => {
          console.error('Window error:', e.message, e.filename, e.lineno);
        });
        // In case remote loading is blocked, try embedded minimal three build or bundled scripts later.
        try {
          await ensureThree();
          await ensureExtras();
        } catch (e) {
          console.error('Script load failure:', e);
          return;
        }

        if (!window.THREE) { console.error('THREE global missing'); return; }

        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100);
      camera.position.set(0, 1.5, 3);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(3, 5, 2);
      scene.add(dir);

      function resizeRenderer() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / Math.max(1, h);
          camera.updateProjectionMatrix();
        }
      }

      function getParam(name) {
        const u = new URL(window.location.href);
        return u.searchParams.get(name) || '';
      }

      const src = decodeURIComponent(getParam('src'));
      console.log('Model src param:', src);
      if (src && window.THREE && THREE.GLTFLoader) {
        const loader = new THREE.GLTFLoader();
        loader.load(src, (gltf) => {
          const root = gltf.scene || gltf.scenes?.[0];
          if (root) {
            scene.add(root);
            // Frame model
            const box = new THREE.Box3().setFromObject(root);
            const size = box.getSize(new THREE.Vector3()).length();
            const center = box.getCenter(new THREE.Vector3());
            controls.target.copy(center);
            const dist = size * 1.5 / Math.tan((camera.fov * Math.PI) / 360);
            camera.position.copy(center.clone().add(new THREE.Vector3(0, size * 0.3, dist)));
            camera.lookAt(center);
          }
        }, undefined, (err) => {
          console.error('GLB load error:', err);
        }, undefined, (e) => {
          console.error('Loader error:', e && (e.message || e));
        });
      }

      function render() {
        resizeRenderer();
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }
      render();
      }
      boot();
    </script>
  </body>
  </html>
