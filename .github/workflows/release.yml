name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '1.0.0'

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install py2app
    
    - name: Build macOS app
      run: |
        python scripts/build_macos_app.py
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v3
      with:
        name: HelpMeSign-macOS
        path: |
          dist/HelpMeSign.app
          HelpMeSign.dmg
        retention-days: 30

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pefile
    
    - name: Build Windows executable
      run: |
        python scripts/build_windows_exe.py
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v3
      with:
        name: HelpMeSign-Windows
        path: |
          dist/HelpMeSign.exe
          HelpMeSign-Setup.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Linux executable
      run: |
        python scripts/build_linux_app.py
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v3
      with:
        name: HelpMeSign-Linux
        path: |
          dist/HelpMeSign
          HelpMeSign.tar.gz
        retention-days: 30

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create release assets
      run: |
        mkdir -p release-assets
        
        # Copy macOS assets
        if [ -d "HelpMeSign-macOS" ]; then
          cp -r HelpMeSign-macOS/* release-assets/
        fi
        
        # Copy Windows assets
        if [ -d "HelpMeSign-Windows" ]; then
          cp -r HelpMeSign-Windows/* release-assets/
        fi
        
        # Copy Linux assets
        if [ -d "HelpMeSign-Linux" ]; then
          cp -r HelpMeSign-Linux/* release-assets/
        fi
        
        # Create zip archive
        cd release-assets
        zip -r ../HelpMeSign-${{ github.event.release.tag_name }}.zip .
    
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./HelpMeSign-${{ github.event.release.tag_name }}.zip
        asset_name: HelpMeSign-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip 